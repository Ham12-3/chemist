<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChemLab 3D</title>
<meta name="description" content="A 3D virtual chemistry laboratory with guided, hands-on experiments.">
<style>
/* =====================================================================
   THEME TOKENS (light / dark)
   ===================================================================== */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f4f6f9; --surface-3:#e9edf2;
  --text:#152030; --muted:#5a6779; --border:#dbe1e8;
  --accent:#2563eb; --accent-text:#ffffff; --accent-soft:#e7eefd;
  --ok:#15803d; --ok-soft:#e3f5e8; --warn:#b45309; --warn-soft:#fdf1df;
  --danger:#c62828; --danger-soft:#fde8e8;
  --shadow:0 10px 30px rgba(15,25,45,.14); --shadow-sm:0 2px 8px rgba(15,25,45,.08);
  --radius:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1218; --surface:#151c25; --surface-2:#1b2430; --surface-3:#232e3c;
    --text:#e5eaf1; --muted:#95a3b5; --border:#2a3646;
    --accent:#5b8cff; --accent-text:#0b1220; --accent-soft:#1c2a45;
    --ok:#3ec46d; --ok-soft:#14301f; --warn:#f2a640; --warn-soft:#382912;
    --danger:#ff6b6b; --danger-soft:#3a1717;
    --shadow:0 10px 30px rgba(0,0,0,.45); --shadow-sm:0 2px 8px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1218; --surface:#151c25; --surface-2:#1b2430; --surface-3:#232e3c;
  --text:#e5eaf1; --muted:#95a3b5; --border:#2a3646;
  --accent:#5b8cff; --accent-text:#0b1220; --accent-soft:#1c2a45;
  --ok:#3ec46d; --ok-soft:#14301f; --warn:#f2a640; --warn-soft:#382912;
  --danger:#ff6b6b; --danger-soft:#3a1717;
  --shadow:0 10px 30px rgba(0,0,0,.45); --shadow-sm:0 2px 8px rgba(0,0,0,.3);
  color-scheme:dark;
}

/* =====================================================================
   LAYOUT
   ===================================================================== */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:56px 1fr;height:100vh;height:100dvh}
#topbar{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
.brand svg{width:26px;height:26px}
#expTabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:4px 2px}
#expTabs::-webkit-scrollbar{display:none}
.tab{border:1px solid transparent;background:transparent;padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:550;font-size:13px}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.tab .num{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface-3);font-size:11px;margin-right:6px;color:var(--muted)}
.tab.active .num{background:var(--accent);color:var(--accent-text)}
.top-actions{display:flex;gap:6px;align-items:center}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:disabled{opacity:.4;cursor:default}
.icon-btn svg{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--danger)}
.pill.on{background:var(--ok-soft);border-color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent);color:var(--ok)}
.pill.on .dot{background:var(--ok)}

#main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#dfe5ec}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#panel{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
@media (max-width:900px){
  #main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 44vh}
  #panel{border-left:0;border-top:1px solid var(--border)}
  .brand span{display:none}
  .card{width:min(320px,calc(100% - 24px))!important}
}
@media (max-width:640px){
  #app{grid-template-rows:auto 1fr}
  #topbar{flex-wrap:wrap;padding:6px 10px;row-gap:4px}
  #expTabs{order:3;flex-basis:100%}
  .top-actions{margin-left:auto}
  #gogglesText{display:none}
  #toasts{width:calc(100% - 24px)}
}
#hint{transition:opacity .6s}
#hint.fade{opacity:0;pointer-events:none}

/* =====================================================================
   COMMON CONTROLS
   ===================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.small{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer;font-size:12.5px;font-weight:600;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.active{background:var(--accent);color:var(--accent-text)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface-3);color:var(--muted)}
.chip.haz{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
kbd{font:11px ui-monospace,Consolas,monospace;padding:1px 5px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;background:var(--surface-2)}

/* =====================================================================
   STAGE OVERLAYS
   ===================================================================== */
#tooltip{position:absolute;pointer-events:none;background:rgba(15,22,32,.92);color:#fff;padding:5px 9px;border-radius:7px;font-size:12.5px;font-weight:600;white-space:nowrap;transform:translate(14px,14px);opacity:0;transition:opacity .12s;z-index:4}
#tooltip small{display:block;font-weight:400;opacity:.8}
#tooltip.show{opacity:1}
#banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-text);padding:8px 10px 8px 14px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:var(--shadow);display:none;align-items:center;gap:10px;z-index:4;max-width:calc(100% - 24px)}
#banner.show{display:flex}
#banner button{background:rgba(255,255,255,.22);border:0;border-radius:999px;padding:3px 10px;cursor:pointer;color:inherit;font-weight:600}
#hint{position:absolute;left:12px;top:12px;font-size:12px;color:#334;background:rgba(255,255,255,.75);padding:5px 10px;border-radius:8px;backdrop-filter:blur(4px);z-index:2}
.card{position:absolute;left:12px;bottom:12px;width:330px;max-height:calc(100% - 70px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;z-index:3;display:none}
.card.show{display:block;animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.card h3{margin:0;font-size:16px}
.card .sub{color:var(--muted);font-size:12.5px;margin:2px 0 8px}
.card .close{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:8px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:18px}
.card .close:hover{background:var(--surface-2)}
.card .use{background:var(--surface-2);border-radius:9px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.card .use b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin:6px 0 10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.contents{list-style:none;padding:0;margin:4px 0 8px;font-size:13px}
.contents li{display:flex;align-items:center;gap:8px;padding:3px 0}
.swatch{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15);flex:none}
.ph-badge{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-weight:700;font-size:12px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.card .section-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 0 4px;font-weight:700}
#toasts{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:4;width:340px;max-width:calc(100% - 24px);pointer-events:none}
.toast{pointer-events:auto;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px 10px 12px;font-size:13px;animation:pop .2s ease-out;position:relative}
.toast.warn{border-left-color:var(--warn)}
.toast.ok{border-left-color:var(--ok)}
.toast h4{margin:0 0 3px;font-size:13.5px;padding-right:20px}
.toast .eq{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--surface-2);padding:4px 6px;border-radius:6px;margin:5px 0;overflow-x:auto;white-space:nowrap}
.toast .x{position:absolute;right:6px;top:4px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:16px}
#gogglesOverlay{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;z-index:1;
  background:radial-gradient(ellipse 60% 70% at 30% 50%,transparent 70%,rgba(120,190,255,.10) 85%,rgba(40,80,130,.28) 100%),radial-gradient(ellipse 60% 70% at 70% 50%,transparent 70%,rgba(120,190,255,.10) 85%,rgba(40,80,130,.28) 100%)}
#gogglesOverlay.on{opacity:1}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:10;font-weight:600;color:var(--muted);text-align:center;padding:16px}

/* =====================================================================
   SIDE PANEL
   ===================================================================== */
.panel-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.panel-head h2{margin:0;font-size:17px}
.panel-head p{margin:2px 0 8px;color:var(--muted);font-size:12.5px}
.progress{height:6px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.progress > div{height:100%;background:var(--ok);width:0;transition:width .4s}
.panel-tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--border)}
.panel-tabs button{flex:1;border:0;background:transparent;padding:7px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.panel-tabs button.active{background:var(--surface-2);color:var(--text)}
.panel-tabs .count{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-text);font-size:11px;margin-left:4px}
.panel-body{flex:1;overflow:auto;padding:12px 14px 16px;min-height:0}
.panel-foot{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.steps{list-style:none;margin:0;padding:0;counter-reset:step}
.step{position:relative;padding:9px 10px 9px 40px;border-radius:10px;margin-bottom:4px;color:var(--muted);font-size:13.5px}
.step::before{counter-increment:step;content:counter(step);position:absolute;left:9px;top:9px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-3);color:var(--muted)}
.step.done{color:var(--text)}
.step.done::before{content:"✓";background:var(--ok);color:#fff}
.step.current{background:var(--accent-soft);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
.step.current::before{background:var(--accent);color:var(--accent-text)}
.step .why{font-size:12.5px;color:var(--muted);margin-top:4px}
.step .feedback{margin-top:6px;font-size:12.5px;padding:6px 8px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.step .feedback.good{background:var(--ok-soft);color:var(--ok)}
.step .controls{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step input[type=number],.step input[type=text]{width:110px;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit}
.step .prog{font-size:12px;font-weight:700;color:var(--accent)}
.readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 8px}
.readout{background:var(--surface-2);border-radius:10px;padding:8px;text-align:center}
.readout b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.readout span{font-size:11px;color:var(--muted)}
.graph-wrap{background:var(--surface-2);border-radius:10px;padding:8px;margin-top:6px}
.graph-wrap canvas{width:100%;height:190px;display:block}
.notebook-entry{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px}
.notebook-entry time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.notebook-entry.warn{color:var(--warn)}
.notebook-entry.result{font-weight:600}
table.results{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 14px}
table.results th,table.results td{border:1px solid var(--border);padding:5px 7px;text-align:left}
table.results th{background:var(--surface-2);font-size:12px}
.free-tips{font-size:13px;color:var(--muted);padding-left:18px}
.free-tips li{margin-bottom:6px}
h4.sec{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

/* =====================================================================
   MODALS
   ===================================================================== */
.modal-backdrop{position:fixed;inset:0;background:rgba(8,12,20,.55);display:none;place-items:center;z-index:20;padding:16px;backdrop-filter:blur(2px)}
.modal-backdrop.show{display:grid}
.modal{background:var(--surface);color:var(--text);border-radius:16px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;animation:pop .18s ease-out}
.modal .m-head{display:flex;gap:12px;align-items:flex-start;padding:18px 20px 6px}
.modal .m-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--accent-soft);flex:none}
.modal.warn .m-icon{background:var(--warn-soft)}
.modal h2{margin:0;font-size:18px}
.modal .m-sub{color:var(--muted);font-size:13px;margin-top:2px}
.modal .m-body{padding:6px 20px 8px;font-size:14px}
.modal .m-body ul{padding-left:18px;margin:6px 0}
.modal .m-body li{margin-bottom:4px}
.modal .m-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px;flex-wrap:wrap}
.intro-grid{display:grid;gap:12px}
.intro-grid section{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.intro-grid h5{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.amount-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.amount-row input[type=range]{flex:1}
.amount-val{font-weight:700;font-size:18px;min-width:90px;text-align:right;font-variant-numeric:tabular-nums}
.quiz-q{font-weight:650;margin:4px 0 10px;font-size:15px}
.quiz-opt{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:6px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.quiz-opt:hover{background:var(--surface-2)}
.quiz-opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.quiz-opt.wrong{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.quiz-explain{font-size:13px;color:var(--muted);background:var(--surface-2);padding:8px 10px;border-radius:8px;margin-top:6px}
.score{font-size:40px;font-weight:800;text-align:center;margin:6px 0}
.ph-chart{display:grid;grid-template-columns:repeat(15,1fr);border-radius:10px;overflow:hidden;margin:8px 0}
.ph-chart div{height:46px;display:grid;place-items:end center;padding-bottom:4px;font-weight:700;color:#fff;font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.ph-scale-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<body>
<div id="app">
  <header id="topbar">
    <div class="brand" title="ChemLab 3D">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M12 3h8M13.5 3v8.5L6.2 25a3 3 0 0 0 2.6 4.5h14.4a3 3 0 0 0 2.6-4.5L18.5 11.5V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 21h14l2.5 4.6a1.6 1.6 0 0 1-1.4 2.4H7.9a1.6 1.6 0 0 1-1.4-2.4z" fill="#2fb8a6"/><circle cx="14" cy="24" r="1.3" fill="#fff"/><circle cx="18.5" cy="25.5" r="1" fill="#fff"/></svg>
      <span>ChemLab 3D</span>
    </div>
    <nav id="expTabs" aria-label="Experiments"></nav>
    <div class="top-actions">
      <button class="pill" id="gogglesPill" title="Put on / take off safety goggles"><span class="dot"></span><span id="gogglesText">Goggles off</span></button>
      <button class="icon-btn" id="btnUndo" title="Nothing to undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="icon-btn" id="btnResetView" title="Reset camera view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg></button>
      <button class="icon-btn" id="btnLabels" title="Show / hide labels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></button>
      <button class="icon-btn" id="btnTheme" title="Theme: auto / light / dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
      <button class="icon-btn" id="btnHelp" title="How to use the lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><circle cx="12" cy="17.5" r=".6" fill="currentColor"/></svg></button>
    </div>
  </header>

  <main id="main">
    <div id="stage">
      <div id="loading">Setting up the laboratory…<br><small>(Loading 3D engine)</small></div>
      <div id="gogglesOverlay"></div>
      <div id="hint">Drag: orbit · Right-drag: pan · Scroll: zoom · Click an item to select it</div>
      <div id="tooltip"></div>
      <div id="banner"><span id="bannerText"></span><button id="bannerCancel">Cancel (Esc)</button></div>
      <div class="card" id="infoCard" role="dialog" aria-live="polite"></div>
      <div id="toasts"></div>
    </div>

    <aside id="panel">
      <div class="panel-head">
        <h2 id="expTitle">Loading…</h2>
        <p id="expSub"></p>
        <div class="progress"><div id="progressBar"></div></div>
      </div>
      <div class="panel-tabs">
        <button id="tabSteps" class="active">Steps</button>
        <button id="tabNotebook">Lab notebook <span class="count" id="nbCount">0</span></button>
      </div>
      <div class="panel-body" id="panelSteps"></div>
      <div class="panel-body" id="panelNotebook" hidden></div>

<script type="module">

   ===================================================================== */

const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function canvasTexture(w, h, draw, srgb = true) {

}

/** Tiny promise-based tween system, driven by the main loop. */
const tweens = [];
function tween(duration, fn) {
  return new Promise(resolve => tweens.push({ t: 0, duration, fn, resolve }));
}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t = Math.min(tw.duration, tw.t + dt);
    tw.fn(tw.duration ? tw.t / tw.duration : 1, dt);
    if (tw.t >= tw.duration) { tweens.splice(i, 1); tw.resolve(); }
  }
}

/** Fresnel rim: glass is clear when you look straight through it and shows its edges at grazing angles, like real glass. */
function addGlassRim(mat, strength, tint) {
  mat.onBeforeCompile = shader => {
    shader.fragmentShader = shader.fragmentShader.replace('#include <dithering_fragment>', `#include <dithering_fragment>
      float rim = pow(1.0 - abs(dot(normalize(vViewPosition), normal)), 2.2);
      gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(${tint}), rim * 0.45);
      gl_FragColor.a = clamp(gl_FragColor.a + rim * ${strength.toFixed(2)}, 0.0, 0.92);`);
  };
}

function registerDecor(obj, name, use) {
  const item = { decor: true, kind: 'decor', name, info: use, group: obj };
  obj.traverse(o => { o.userData.decor = item; });
  decorItems.push(item);
  return item;
}
let sinkItem = null;

/** A labelled glass bottle mesh (used for shelf stock bottles). */
function makeBottleMesh(r, h, amber, liquidColor, name, sub) {
  const g = new THREE.Group();
  const pts = [[0.0002, 0], [r, 0], [r, h * 0.7], [r * 0.45, h * 0.86], [r * 0.4, h], [0.0002, h]].map(p => new THREE.Vector2(p[0], p[1]));
  const body = mesh(new THREE.LatheGeometry(pts, 28), amber ? MAT.amber : MAT.glass, false); body.renderOrder = 2; g.add(body);
  const liq = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.92, r * 0.92, h * 0.55, 24), new THREE.MeshStandardMaterial({ color: liquidColor, transparent: true, opacity: amber ? 0.9 : 0.55, roughness: 0.2 }));
  liq.position.y = h * 0.29; liq.renderOrder = 1; g.add(liq);
  g.add(cyl(r * 0.45, r * 0.45, h * 0.14, MAT.black, 20, 0, h + h * 0.06, 0));
  const lab = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.01, r * 1.01, h * 0.38, 24, 1, true, -0.9, 1.8), new THREE.MeshStandardMaterial({ map: labelTexture(name, sub), roughness: 0.7 }));
  lab.position.y = h * 0.36; g.add(lab);
  return g;
}

/** Paper label texture with a title and a subtitle. */
function labelTexture(title, sub, accent = '#2563eb') {
  return canvasTexture(512, 256, (g, w, h) => {
    g.fillStyle = '#fbfaf6'; g.fillRect(0, 0, w, h);
    g.fillStyle = accent; g.fillRect(0, 0, w, 26);
    g.fillStyle = '#111'; g.textAlign = 'center'; g.textBaseline = 'middle';
    let size = 54; g.font = `bold ${size}px system-ui, sans-serif`;
    while (g.measureText(title).width > w - 30 && size > 24) { size -= 2; g.font = `bold ${size}px system-ui, sans-serif`; }
    g.fillText(title, w / 2, 100);
    g.font = '40px system-ui, sans-serif'; g.fillStyle = '#333';
    g.fillText(sub || '', w / 2, 172);
  });
}

function periodicTableTexture() {
  const symbols = 'H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og'.split(' ');
  const pos = []; // [row, col] for each element (1-based), f-block in rows 9/10
  const add = (z, r, c) => { pos[z] = [r, c]; };
  add(1, 1, 1); add(2, 1, 18);
  for (let p = 2; p <= 3; p++) { const s = p === 2 ? 3 : 11; add(s, p, 1); add(s + 1, p, 2); for (let i = 0; i < 6; i++) add(s + 2 + i, p, 13 + i); }

/* ---------- geometry helpers ---------- */
function v2(arr) { return arr.map(([r, y]) => new THREE.Vector2(Math.max(r, 0.0002), y)); }
function radiusAt(profile, y) {

function vesselGeometry(inner, t, outer = null, lip = true) {
  outer = outer || [[0, -t], [inner[0][0] + t * 0.4, -t], ...inner.map(([r, y]) => [r + t, y])];

/* ---------- Container: anything that holds a mixture ---------- */

/* ---------- Builders for each item ---------- */

function makeBeaker(cap = 250, name) {
  const d = { 250: [0.033, 0.092], 100: [0.0235, 0.07], 50: [0.019, 0.056] }[cap];
  const e = new Equip('beaker', name || `Beaker (${cap} cm³)`, { radius: d[0] + 0.012, heatSafe: true });
  const t = 0.0016, prof = [[d[0], 0], [d[0], d[1]]];

  cav.add(glassMesh(vesselGeometry(prof, t)));
  e.container = new Container(e, { profile: prof, capacity: cap, parent: cav });
  const step = cap / 5, marks = [];
  for (let v = step; v <= cap; v += step) marks.push({ y: heightForVolume(e.container.tab, v), major: true, label: v });
  for (let v = step / 2; v < cap; v += step) marks.push({ y: heightForVolume(e.container.tab, v), major: false });

  if (rig.deliveryIn) pts.push(V3(lt.x, top - 0.02, lt.z), V3(lt.x, lt.y + 0.012, lt.z));
  else pts.push(V3(lt.x + 0.004, top + 0.035, lt.z));
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  rig.delivery = glassMesh(new THREE.TubeGeometry(curve, 60, 0.0028, 8));
  rig.delivery.userData.equip = rig;
  rig.deliveryEnd = pts[pts.length - 1].clone();
  scene.add(rig.delivery);

/** A mixture inside a container. Volumes in cm³, amounts in moles. */
class Mixture {
  constructor() { this.vol = 0; this.sp = {}; this.ind = {}; this.ppt = {}; this.solid = {}; this.solid0 = {}; this.added = {}; this.temp = 20; this.ver = 0; }
  touch() { this.ver++; }
  addSolution(id, vol) {
    const s = SUBSTANCES[id];
    if (this.vol + vol > 0) this.temp = (this.temp * this.vol + 20 * vol) / (this.vol + vol);
    this.vol += vol;
    const mol = (s.conc || 0) * vol / 1000;
    for (const [k, c] of Object.entries(s.ions || {})) this.sp[k] = (this.sp[k] || 0) + c * mol;
    for (const [k, c] of Object.entries(s.systems || {})) this.sp[k] = (this.sp[k] || 0) + c * mol;
    if (s.indicator) this.ind[s.indicator] = (this.ind[s.indicator] || 0) + vol;
    this.added[id] = (this.added[id] || 0) + vol;
    this.touch();
    return this;
  }
  addSolid(id, mol) {
    this.solid[id] = (this.solid[id] || 0) + mol;
    this.solid0[id] = (this.solid0[id] || 0) + mol;
    this.touch();
  }
  /** Remove a fraction f of the liquid (and everything dissolved or suspended in it). */
  split(f) {
    f = clamp(f, 0, 1);
    const o = new Mixture(); o.temp = this.temp;
    o.vol = this.vol * f; this.vol -= o.vol;
    for (const key of ['sp', 'ind', 'ppt', 'added']) {
      for (const [k, v] of Object.entries(this[key])) { o[key][k] = v * f; this[key][k] = v * (1 - f); }
    }
    if (this.vol < 1e-4) this.clearLiquid();
    this.touch();
    return o;
  }
  merge(o) {
    if (this.vol + o.vol > 0) this.temp = (this.temp * this.vol + o.temp * o.vol) / (this.vol + o.vol);
    this.vol += o.vol;
    for (const key of ['sp', 'ind', 'ppt', 'added', 'solid', 'solid0']) for (const [k, v] of Object.entries(o[key])) this[key][k] = (this[key][k] || 0) + v;
    this.touch();
  }
  clearLiquid() { this.vol = 0; this.sp = {}; this.ind = {}; this.ppt = {}; this.added = {}; this.touch(); }
  clearAll() { this.clearLiquid(); this.solid = {}; this.solid0 = {}; this.temp = 20; this.touch(); }
  clone() {
    const o = new Mixture(); o.vol = this.vol; o.temp = this.temp;
    for (const k of ['sp', 'ind', 'ppt', 'solid', 'solid0', 'added']) o[k] = { ...this[k] };
    return o;
  }
}

const KW = 1e-14;
/** Average charge of a weak acid system at a given [H⁺]. */
function avgCharge(sys, h) {
  let term = 1, sum = 1, q = sys.z0;
  for (let i = 0; i < sys.Ka.length; i++) { term *= sys.Ka[i] / h; sum += term; q += term * (sys.z0 - i - 1); }
  return q / sum;
}

const Chem = {
  /** Net strong base (moles of OH⁻ available), counting weak systems as fully protonated. */
  netBase(m) {
    let n = 0;
    for (const [k, v] of Object.entries(m.sp)) n += v * (IONS[k]?.z ?? WEAK[k]?.z0 ?? 0);
    return n;
  },
  /**
   * pH from the charge balance:  [H⁺] − [OH⁻] + Σ(charges of all ions) = 0.
   * Strong ions are fixed; weak acid systems (ethanoic acid, ammonium, carbonate) are in equilibrium.
   * Solved by bisection on log[H⁺]. This gives correct titration curves, buffers and salt hydrolysis.
   */

let FX;   // created in init

  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xdfeff7, transparent: true, opacity: 0.6, roughness: 0.1, depthWrite: false }));

  snapSpotsFor(eq).forEach((s, i) => { const r = snapRings[i]; if (r) r.material.opacity = near && near.pos.distanceTo(s.pos) < 1e-6 ? 0.95 : 0.45; });
}
/** Places where an item can "click into" position. */
function snapSpotsFor(eq) {
  const spots = [];
  if (['beaker', 'flask', 'cylinder'].includes(eq.kind)) {
    for (const s of equipment) {
      if (s.kind === 'hotplate' && s.onBench && !ridersOf(s).some(r => r !== eq)) spots.push({ type: 'heat', src: s, pos: s.group.position.clone().setY(BENCH_Y + s.topY), r: 0.07 });
      if (s.kind === 'bunsen' && s.onBench && !ridersOf(s).some(r => r !== eq)) spots.push({ type: 'heat', src: s, pos: s.group.position.clone().setY(BENCH_Y + s.topY), r: 0.06 });
      if (s.kind === 'burette' && eq.kind !== 'cylinder' && (!S.underBurette || S.underBurette === eq)) spots.push({ type: 'burette', src: s, pos: s.group.localToWorld(s.snapLocal.clone()), r: 0.06 });
    }
  }
  if (eq.kind === 'testtube') for (const rk of equipment.filter(x => x.kind === 'rack' && x.onBench)) {
    rk.slots.forEach((x, i) => { if (!rk.tubes.some(t => t.slot === i)) spots.push({ type: 'slot', src: rk, slot: i, pos: rk.group.localToWorld(V3(x, 0.009, 0)), r: 0.012 }); });
  }
  if (eq.kind === 'bunsen') for (const rig of equipment.filter(x => x.kind === 'boilingtube')) {
    const p = rig.tubeG.localToWorld(V3(0, 0, 0)); spots.push({ type: 'rig', src: rig, pos: V3(p.x, BENCH_Y, p.z), r: 0.06 });
  }
  return spots;
}
function dropItem(eq) {
  hideSnapRings();
  let snapped = nearestSnap(eq);
  S.dragRay = null;
  if (eq.kind === 'testtube') {               // back into a rack slot – the one aimed at, or where it came from
    if (snapped) rackAddTube(snapped.src, eq, snapped.slot); else rackAddTube(eq.fromRack, eq, eq.fromSlot);
    if (snapped && (snapped.src !== eq.fromRack || snapped.slot !== eq.fromSlot)) notebookLog(`Moved ${eq.name.toLowerCase()} to another place in the rack.`, 'action');
    bus.emit('moved', { equip: eq }); renderCard();
    return;
  }
  const g = eq.group; g.position.y = BENCH_Y;
  if (snapped?.type === 'heat') {
    if (!heatAllowed(eq, snapped.src)) snapped = null;
    else {
      eq.onSource = snapped.src; g.position.copy(snapped.pos);
      if (snapped.src.kind === 'bunsen') snapped.src.tripod.visible = true;
      notebookLog(`Placed the ${eq.name.toLowerCase()} on the ${snapped.src.name.toLowerCase()}.`, 'action');
      bus.emit('placedOnHeat', { equip: eq, source: snapped.src });
    }
  } else if (snapped?.type === 'burette') {
    g.position.copy(snapped.pos); S.underBurette = eq;
    bus.emit('placedUnderBurette', { equip: eq });
  } else if (snapped?.type === 'rig') {
    g.position.copy(snapped.pos); snapped.src.bunsen = eq;
    bus.emit('bunsenUnderTube', { equip: eq });
    toast({ title: 'Bunsen burner in position', text: 'The burner is now under the boiling tube. Light it to start heating.', kind: 'ok', time: 4000 });
  }
  if (!snapped) resolveCollisions(eq);
  moveRiders(eq);
  bus.emit('moved', { equip: eq });
  renderCard();
}
function resolveCollisions(eq) {
  const g = eq.group.position;
  for (let iter = 0; iter < 10; iter++) {
    let moved = false;
    for (const o of equipment) {
      if (o === eq || !o.onBench || o.onSource === eq || eq.onSource === o) continue;
      const op = o.group.position;
      const dx = g.x - op.x, dz = g.z - op.z, d = Math.hypot(dx, dz), min = eq.radius + o.radius;
      if (d < min) {
        const nx = d > 1e-4 ? dx / d : 1, nz = d > 1e-4 ? dz / d : 0;
        g.x += nx * (min - d + 0.002); g.z += nz * (min - d + 0.002); moved = true;
      }
    }
    g.x = clamp(g.x, BENCH.xMin, BENCH.xMax); g.z = clamp(g.z, BENCH.zMin, BENCH.zMax);
    if (!moved) break;
  }
}

/* ---------- Safety checks ---------- */
function requireGoggles(fn) {
  if (S.goggles) { fn(); return; }
  bus.emit('noGoggles');
  notebookLog('Safety: tried to work without goggles.', 'warn');
  openModal({
    icon: '🥽', warn: true, title: 'Safety first – goggles on!',
    sub: 'You are about to handle chemicals or heat.',
    body: `<p>Please put on your <b>safety goggles</b> before you start. Acids, alkalis and other chemicals can splash, and hot liquids can spit. Even a small splash can permanently damage your eyes – and goggles stop it.</p>`,
    actions: [{ label: 'Cancel' }, { label: 'Put on goggles & continue', primary: true, fn: () => { setGoggles(true); fn(); } }],
  });
}
function heatAllowed(eq, source) {
  if (!eq.heatSafe) {
    safetyWarning('Do not heat this!', eq.heatWarning || `The ${eq.name.toLowerCase()} should not be heated.`, `heat-${eq.kind}`);
    return false;
  }
  const flam = flammableIn(eq);
  if (flam) { safetyWarning(`Careful – ${flam.name.toLowerCase()} is flammable`, flam.heatWarning || `${flam.name} catches fire easily. Do not heat it directly.`); return false; }
  return true;
}
function flammableIn(eq) {
  const m = eq.container?.m; if (!m) return null;
  for (const [id, v] of Object.entries(m.added)) { const s = SUBSTANCES[id]; if (s.flammable && v / Math.max(m.vol, 0.001) > 0.02) return s; }
  return null;
}
function safetyWarning(title, text, key) {
  notebookLog('Safety warning: ' + title, 'warn');
  bus.emit('safetyWarning', { key });
  openModal({ icon: '⚠️', warn: true, title, body: `<p>${text}</p>`, actions: [{ label: 'Got it', primary: true }] });
}

function setGoggles(on) {
  S.goggles = on;
  for (const e of equipment) if (e.kind === 'goggles') e.group.visible = !on;
  $('#gogglesOverlay').classList.toggle('on', on);
  $('#gogglesPill').classList.toggle('on', on);
  $('#gogglesText').textContent = on ? 'Goggles on' : 'Goggles off';
  notebookLog(on ? 'Put on safety goggles.' : 'Took off safety goggles.', 'action');
  if (S.selected?.kind === 'goggles') deselect();
  bus.emit('goggles', { on });
  rebuildPickables();
}

/* ---------- Modes (pick a second object) ---------- */
function startMode(type, source, text) {
  S.mode = { type, source };
  $('#bannerText').textContent = text;
  $('#banner').classList.add('show');
}
function cancelMode() { S.mode = null; $('#banner').classList.remove('show'); }

function handleModeTarget(t) {
  const md = S.mode, src = md.source;
  const say = (text) => toast({ title: 'Try another item', text, kind: 'warn', time: 3500 });
  if (t === src) return;
  switch (md.type) {
    case 'pour': {
      if (t === sinkItem) { cancelMode(); return emptyToSink(src); }
      if (!t.container || t.kind === 'pipette') return say('You can only pour into a beaker, flask, test tube, measuring cylinder or burette.');
      if (t.container.infinite) return say('Never pour chemicals back into a stock bottle – it would contaminate it for everyone.');
      if (t.kind === 'burette' && t.tap !== 'closed') return say('Close the burette tap before filling it.');
      if (t.container.free < 0.05) return say(`The ${t.name.toLowerCase()} is full.`);
      cancelMode(); openPourDialog(src, t); return;
    }
    case 'drops': {
      if (!t.container || t.container.infinite || ['pipette', 'burette'].includes(t.kind)) return say('Add drops to a beaker, flask or test tube.');
      cancelMode(); openDropsDialog(src, t); return;
    }
    case 'pipetteFill': {
      if (!t.container || ['pipette', 'burette'].includes(t.kind)) return say('Fill the pipette from a bottle, beaker or flask.');
      if (t.kind === 'dropper') return say('Dropper bottles are too small to fill a 25.0 cm³ pipette.');
      if (!t.container.infinite && t.container.vol < 25.0) return say(`There is not enough liquid in the ${t.name.toLowerCase()} (you need at least 25.0 cm³).`);
      cancelMode(); requireGoggles(() => pipetteFill(src, t)); return;
    }
    case 'pipetteRelease': {
      if (!t.container || t.container.infinite || ['pipette', 'burette'].includes(t.kind)) return say('Release the liquid into a flask or beaker.');
      if (t.container.free < 25) return say(`There is not enough space in the ${t.name.toLowerCase()}.`);
      cancelMode(); pipetteRelease(src, t); return;
    }
    case 'buretteFill': {
      if (t.kind !== 'reagent' && !(t.container && t.container.vol >= 1 && !['pipette', 'burette'].includes(t.kind))) return say('Fill the burette from a reagent bottle or a beaker of solution.');
      cancelMode(); requireGoggles(() => buretteFill(src, t)); return;
    }
    case 'wireDip': {
      if (t.kind === 'watchglass') { cancelMode(); requireGoggles(() => dipWire(src, t)); return; }
      if (t.container?.infinite) return say('Never dip equipment into a stock bottle – it would contaminate it.');
      if (t.container && t.container.vol > 0.5) { cancelMode(); requireGoggles(() => dipWire(src, t)); return; }
      return say('Dip the wire into a solid sample on a watch glass, or into the acid beaker to clean it.');
    }
  }
}

/* ---------- Undo: snapshots of every container before each action ---------- */
const History = {
  stack: [],
  push(label) {
    this.stack.push({
      label,
      snap: equipment.filter(e => e.container && !e.container.infinite).map(e => ({ e, m: e.container.m.clone() })),
      burettes: equipment.filter(e => e.kind === 'burette').map(b => ({ b, dispensed: b.dispensed, fillVol: b.fillVol, runStart: b.runStart })),
      results: JSON.parse(JSON.stringify(S.results)), titr: JSON.parse(JSON.stringify(S.titr)),
    });
    if (this.stack.length > 25) this.stack.shift();
    updateUndoButton();
  },
  top() { return this.stack[this.stack.length - 1]; },
  undo() {
    if (S.busy) return;
    const h = this.stack.pop();
    if (!h) return toast({ title: 'Nothing to undo', text: 'Pours, drops and pipette or burette actions can be undone.', time: 3000 });
    for (const { e, m } of h.snap) if (equipment.includes(e)) { e.container.m = m; e.container.appVer = -1; e.container.lastLevel = -1; e.container.lastSolid = -1; }
    for (const x of h.burettes) { Object.assign(x.b, { dispensed: x.dispensed, fillVol: x.fillVol, runStart: x.runStart }); if (x.b.tap !== 'closed') { x.b.tap = 'closed'; x.b.tapHandle.rotation.x = 0; } }
    S.results = h.results; S.titr = h.titr; S.titr.dirty = true; nbDirty = true;
    notebookLog(`Undo: ${h.label}.`, 'action');
    toast({ title: 'Undone', text: `"${h.label}" was undone. Steps you have already completed stay completed.`, time: 3500 });
    updateUndoButton(); renderCard();
  },
  clear() { this.stack = []; updateUndoButton(); },
};
function updateUndoButton() { const b = $('#btnUndo'); if (b) { b.disabled = !History.stack.length; b.title = History.stack.length ? `Undo: ${History.top().label} (Ctrl+Z)` : 'Nothing to undo'; } }

/* ---------- Mixing: the heart of every pour, drop and transfer ---------- */
/** Add a mixture to a container, then let the chemistry engine react it. */
function mergeInto(tgt, piece) {
  const c = tgt.container;
  const n = Chem.neutralised(c.m, piece);
  c.m.merge(piece);
  if (n > 1e-7) {
    const dT = n * 57100 / (Math.max(c.m.vol, 1) * 4.18);
    c.m.temp += dT;
    onReaction(tgt, REACTION_BY_ID.neutralisation, n);
  }
  for (const f of Chem.react(c.m)) onReaction(tgt, f.rule, f.x);
}
function takeFrom(src, vol) {
  const c = src.container;
  if (c.infinite) return mixtureOf(c.substance, vol);
  return c.m.split(Math.min(1, vol / Math.max(c.m.vol, 1e-9)));
}
/** Visual effects + notebook + explanation whenever a reaction rule fires. */
function onReaction(e, rule, x) {
  if (rule.effects.precipitate && e.container?.profile) {
    const prod = Object.keys(rule.products).find(k => SOLIDS[k]);
    emitFlakes(e, clamp(Math.round(x * 2e6), 6, 30), SOLIDS[prod].c);
  }
  if (rule.effects.gas && e.container?.profile) emitBubbles(e, clamp(Math.round(x * 4e5), 4, 30));
  const key = rule.id + ':' + e.id;
  if (!S.logged.has(key)) {
    S.logged.add(key);
    notebookLog(`${e.name}: ${rule.observation}`, 'obs');
    if (rule.effects.precipitate) {
      const prod = Object.keys(rule.products).find(k => SOLIDS[k]);
      recordResult('precip', e.name + key, { tube: e.label || e.name, mix: Chem.describe(e.container.m).filter(d => !d.name.includes('precipitate')).map(d => d.name).join(' + '), result: `${SOLIDS[prod].colourName} precipitate of ${SOLIDS[prod].name.toLowerCase()}` });
    }
  }
  if (!S.explained.has(rule.id)) {
    S.explained.add(rule.id);
    toast({ title: rule.title, eq: rule.equation, eq2: rule.ionic, text: rule.explain, time: 14000 });
  }
  bus.emit('reaction', { rule: rule.id, equip: e, x });
}

/* ---------- Pouring ---------- */
async function doPour(src, tgt, amount) {
  History.push(tgt === sinkItem ? `Empty the ${src.name.toLowerCase()}` : `Pour into the ${tgt.name.toLowerCase()}`);
  S.busy++; renderCard();
  const g = src.group, parent = g.parent;
  const homeLocal = g.position.clone(), homeQuat = g.quaternion.clone();
  scene.attach(g);
  const startPos = g.position.clone();
  const h = src.mouthY, theta = src.kind === 'reagent' ? 1.95 : 1.8;
  const tMouth = tgt === sinkItem ? sinkItem.pourPoint.clone() : tgt.mouthWorld();
  const side = (startPos.x >= tMouth.x ? 1 : -1);
  const off = Math.min(0.012, (tgt.mouthR || 0.02) * 0.45);
  const pourPt = V3(tMouth.x + side * off, tMouth.y + 0.035, tMouth.z);
  const startMouth = src.mouthWorld();
  const place = (mouth, phi) => {
    g.rotation.set(0, 0, side * phi);
    g.position.set(mouth.x + side * h * Math.sin(phi), mouth.y - h * Math.cos(phi), mouth.z);
    g.updateMatrixWorld(true);
  };
  const stream = FX.stream;
  const color = src.container.infinite ? Chem.appearance(mixtureOf(src.container.substance, 10)).color : src.container.appearance().color.clone();
  await tween(0.75, t => { const e = ease(t); const m = startMouth.clone().lerp(pourPt, e); m.y += Math.sin(Math.PI * e) * 0.07; place(m, theta * 0.7 * e); });
  const pourTime = clamp(amount / 18, 0.7, 2.4);
  let poured = 0;
  await tween(pourTime, (t, dt) => {
    place(pourPt, theta * (0.7 + 0.3 * Math.min(1, t * 1.5)));
    const want = Math.min(amount, amount * clamp((t - 0.08) / 0.9, 0, 1));
    const step = want - poured;
    if (step > 1e-6) {
      if (tgt === sinkItem) src.container.m.split(Math.min(1, step / Math.max(src.container.m.vol, 1e-9)));
      else mergeInto(tgt, takeFrom(src, step));
      poured = want;
    }
    const toY = tgt === sinkItem ? BENCH_Y - 0.15 : tgt.container.surfaceWorld().y;
    if (t > 0.05 && t < 0.98) setStream(stream, src.mouthWorld(), toY, clamp(0.0018 + amount / 4000, 0.0018, 0.004), color); else stream.visible = false;
  });
  stream.visible = false;
  if (tgt === sinkItem) { src.container.m.clearAll(); }
  const endPos = g.position.clone(), endQuat = g.quaternion.clone();
  await tween(0.6, t => { const e = ease(t); g.position.lerpVectors(endPos, startPos, e); g.quaternion.slerpQuaternions(endQuat, new THREE.Quaternion(), e); g.position.y += Math.sin(Math.PI * e) * 0.04; });
  parent.attach(g); g.position.copy(homeLocal); g.quaternion.copy(homeQuat);
  S.busy--;
  if (tgt === sinkItem) {
    notebookLog(`Emptied and rinsed the ${src.name.toLowerCase()} in the sink.`, 'action');
    bus.emit('emptied', { source: src });
  } else {
    if (tgt.kind === 'burette') { tgt.dispensed = 0; tgt.runStart = 0; tgt.fillVol = tgt.container.vol; S.titr.points = []; S.titr.end = null; S.titr.dirty = true; }
    const what = src.container.infinite ? SUBSTANCES[src.container.substance].name.toLowerCase() : 'the contents of the ' + src.name.toLowerCase();
    notebookLog(`Poured ${fmt(amount, amount < 10 ? 1 : 0)} cm³ of ${what} into the ${tgt.name.toLowerCase()}.`, 'action');
    bus.emit('pour', { source: src, target: tgt, volume: amount, substance: src.container.substance });
  }
  renderCard();
}
function emptyToSink(src) {
  if (!src.container || src.container.vol < 0.01) {
    if (src.container && Chem.solidGrams(src.container.m) > 0) { src.container.m.clearAll(); notebookLog(`Cleaned out the ${src.name.toLowerCase()}.`, 'action'); renderCard(); return; }
    return toast({ title: 'Nothing to empty', text: `The ${src.name.toLowerCase()} is already empty.`, kind: 'warn', time: 3000 });
  }
  if (src.kind === 'burette') { History.push('Empty the burette'); src.container.m.clearAll(); src.dispensed = 0; src.runStart = 0; notebookLog('Emptied the burette.', 'action'); renderCard(); return; }
  if (src.kind === 'pipette' || !src.movable && !src.parentEquip) { src.container.m.clearAll(); renderCard(); return; }
  requireGoggles(() => doPour(src, sinkItem, src.container.vol));
}

/* ---------- Drops from a dropper bottle ---------- */
function makeDropperProp() {
  const g = new THREE.Group();
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.0012, 0.06, 10), MAT.glass); tube.renderOrder = 2; tube.position.y = 0.03; g.add(tube);
  const teat = new THREE.Mesh(new THREE.SphereGeometry(0.0065, 12, 10), MAT.rubber); teat.scale.y = 1.6; teat.position.y = 0.068; g.add(teat);
  return g;
}
async function doDrops(bottle, tgt, n) {
  History.push(`Add drops of ${SUBSTANCES[bottle.substance].name.toLowerCase()}`);
  S.busy++; renderCard();
  const prop = makeDropperProp();
  const mouth = tgt.mouthWorld();
  prop.position.set(mouth.x, mouth.y + 0.015, mouth.z);
  scene.add(prop);
  const color = Chem.appearance(mixtureOf(bottle.substance, 1)).color;
  await tween(0.25, t => { prop.position.y = mouth.y + 0.06 - 0.045 * ease(t); });
  for (let i = 0; i < n; i++) {
    const tip = prop.position.clone();
    const piece = mixtureOf(bottle.substance, DROP_ML);
    await tween(0.08, t => { prop.children[1].scale.set(1 - 0.25 * t, 1.6 - 0.4 * t, 1 - 0.25 * t); });
    fallingDrop(tip, tgt, color, () => { mergeInto(tgt, piece); bus.emit('drop', { source: bottle, target: tgt, substance: bottle.substance }); });
    await tween(0.12, t => { prop.children[1].scale.set(0.75 + 0.25 * t, 1.2 + 0.4 * t, 0.75 + 0.25 * t); });
    await wait(n > 5 ? 0.05 : 0.15);
  }
  await wait(0.35);
  await tween(0.2, t => { prop.position.y = mouth.y + 0.015 + 0.06 * t; });
  scene.remove(prop);
  S.busy--;
  S.lastDrop = { bottle, target: tgt };
  const sub = SUBSTANCES[bottle.substance];
  notebookLog(`Added ${n} drop${n > 1 ? 's' : ''} of ${sub.name.toLowerCase()} to the ${tgt.name.toLowerCase()}.`, 'action');
  bus.emit('drops', { source: bottle, target: tgt, n, substance: bottle.substance });
  renderCard();
}

/* ---------- Pipette ---------- */
async function moveGroup(g, to, dur) { const from = g.position.clone(); await tween(dur, t => g.position.lerpVectors(from, to, ease(t))); }
async function pipetteFill(pip, src) {
  History.push('Fill the pipette');
  S.busy++; renderCard();
  const g = pip.group, home = g.position.clone(), c = pip.container;
  const mouth = src.mouthWorld();
  const surfY = src.container.infinite ? src.group.localToWorld(V3(0, 0.06, 0)).y : src.container.surfaceWorld().y;
  const bottomY = src.container.infinite ? src.group.localToWorld(V3(0, 0.01, 0)).y : src.container.parent.localToWorld(V3(0, 0.004, 0)).y;
  await moveGroup(g, V3(home.x, home.y + 0.18, home.z), 0.45);
  await moveGroup(g, V3(mouth.x, mouth.y + 0.04, mouth.z), 0.6);
  await moveGroup(g, V3(mouth.x, Math.max(bottomY + 0.004, surfY - 0.025), mouth.z), 0.45);
  c.m.clearAll();
  c.m.merge(takeFrom(src, 25.0));
  c.fillAnim = 0;
  await tween(1.4, t => { c.fillAnim = t; });
  c.fillAnim = null;
  await moveGroup(g, V3(mouth.x, mouth.y + 0.06, mouth.z), 0.5);
  await moveGroup(g, home, 0.7);
  S.busy--;
  notebookLog(`Filled the pipette with 25.0 cm³ of ${src.container.infinite ? SUBSTANCES[src.container.substance].name.toLowerCase() : 'liquid from the ' + src.name.toLowerCase()}.`, 'action');
  bus.emit('pipetteFill', { source: src });
  select(pip);
  startMode('pipetteRelease', pip, 'Now click the container to release the 25.0 cm³ into.');
}
async function pipetteRelease(pip, tgt) {
  History.push('Release the pipette');
  S.busy++; renderCard();
  const g = pip.group, home = g.position.clone(), c = pip.container;
  const mouth = tgt.mouthWorld();
  await moveGroup(g, V3(home.x, home.y + 0.18, home.z), 0.45);
  await moveGroup(g, V3(mouth.x, mouth.y + 0.04, mouth.z), 0.6);
  await moveGroup(g, V3(mouth.x, mouth.y - 0.035, mouth.z), 0.4);
  const total = c.m.vol, added = Object.keys(c.m.added);
  let moved = 0;
  c.fillAnim = 1;
  await tween(1.7, t => {
    c.fillAnim = 1 - t;
    const want = total * t, step = want - moved;
    if (step > 1e-6 && c.m.vol > 1e-6) { mergeInto(tgt, c.m.split(Math.min(1, step / c.m.vol))); moved = want; }
  });
  if (c.m.vol > 0) mergeInto(tgt, c.m.split(1));
  c.m.clearAll(); c.fillAnim = null;
  await moveGroup(g, V3(mouth.x, mouth.y + 0.06, mouth.z), 0.4);
  await moveGroup(g, home, 0.7);
  S.busy--;
  notebookLog(`Released 25.0 cm³ from the pipette into the ${tgt.name.toLowerCase()}.`, 'action');
  bus.emit('pipetteRelease', { target: tgt, volume: total, substances: added });
  renderCard();
}

/* ---------- Burette ---------- */
async function buretteFill(bur, src) {
  History.push('Fill the burette');
  S.busy++; renderCard();
  const c = bur.container;
  c.m.clearAll();
  const total = src.container.infinite ? 50 : Math.min(50, src.container.vol);
  let moved = 0;
  await tween(1.2, t => { const want = total * t, step = want - moved; if (step > 1e-6) { c.m.merge(takeFrom(src, step)); moved = want; } });

function setTap(bur, mode) {

/** All titration runs recorded so far (run 1 is the rough run). */

}
/** Burette liquid reaches the flask: mix, show the brief pink flash near the end point, record the curve and each run. */
function buretteDeliver(bur, tgt, piece) {
  const isFlask = tgt.kind === 'flask' || tgt.kind === 'beaker';
  // a flask with none of the burette liquid in it yet = a new titration run
  if (isFlask && !Object.keys(piece.added).some(id => (tgt.container.m.added[id] || 0) > 1e-9)) {
    bur.runStart = bur.dispensed - piece.vol;

}
function updateBurette(bur, dt) {
  if (bur.tap === 'closed') { bur.stream && (bur.stream.visible = false); return; }
  const tgt = S.underBurette;

    bur.tap = 'closed'; bur.tapHandle.rotation.x = 0; if (bur.stream) bur.stream.visible = false;

}

/* ---------- Flame test wire ---------- */
async function moveWireTo(w, loopTarget, tilt, dur) {
  const g = w.group, from = g.position.clone(), r0 = g.rotation.z;
  const L = w.loopLocal.y;
  const to = V3(loopTarget.x + L * Math.sin(tilt), loopTarget.y - L * Math.cos(tilt), loopTarget.z);
  await tween(dur, t => { const e = ease(t); g.position.lerpVectors(from, to, e); g.position.y += Math.sin(Math.PI * e) * 0.06; g.rotation.z = lerp(r0, tilt, e); });
}
async function wireHome(w) {
  const g = w.group, from = g.position.clone(), r0 = g.rotation.z;
  await tween(0.7, t => { const e = ease(t); g.position.lerpVectors(from, w.home, e); g.position.y += Math.sin(Math.PI * e) * 0.06; g.rotation.z = lerp(r0, 0, e); });
}
function flameColourOf(ions) {
  if (!ions.length) return null;
  if (ions.includes('Na+')) return new THREE.Color(FLAME['Na+'].colour);   // sodium's yellow hides other colours
  const c = new THREE.Color(0, 0, 0); ions.forEach(i => c.add(new THREE.Color(FLAME[i].colour))); return c.multiplyScalar(1 / ions.length);
}
async function dipWire(w, t) {
  S.busy++; renderCard();
  const target = t.kind === 'watchglass' ? t.group.localToWorld(V3(0, 0.012, 0)) : t.container.surfaceWorld().add(V3(0, -0.006, 0));
  await moveWireTo(w, V3(target.x, target.y + 0.04, target.z), 2.8, 0.8);
  await moveWireTo(w, target, 2.8, 0.35);
  await wait(0.35);

  else { ions = Chem.flameIons(t.container.m); sampleName = t.name; }

    bus.emit('wireClean');

    w.coatMesh.visible = ions.length > 0;

    if (w.contaminated) toast({ title: 'Your wire was not clean', text: 'The loop still had another sample on it, so the flame colour will be mixed. Dip it in the acid beaker to clean it, then try again.', kind: 'warn', time: 6000 });

  S.busy--; renderCard();
}
async function holdInFlame(w) {
  const b = equipment.find(e => e.kind === 'bunsen' && e.on);

/* ---------- Delivery tube (copper carbonate experiment) ---------- */
function toggleDelivery(rig) {
  rig.deliveryIn = !rig.deliveryIn;
  buildDeliveryTube(rig, rig.limeTube);
  rebuildPickables();
  notebookLog(rig.deliveryIn ? 'Put the delivery tube back into the limewater.' : 'Lifted the delivery tube out of the limewater.', 'action');
  bus.emit('delivery', { inLime: rig.deliveryIn, heating: !!(rig.bunsen && rig.bunsen.on) });
  renderCard();

/** CO₂ produced by heating reaches the limewater (if the delivery tube dips into it). */
function routeGas(rig, n, dt) {
  if (!rig.limeTube) return;
  const lime = rig.limeTube;
  if (rig.deliveryIn && lime.container.vol > 0.5) {
    const m = lime.container.m;
    const add = n * 0.012;     // only a little of the gas dissolves as the bubbles pass through
    if (add > 0) { m.sp.CO3 = (m.sp.CO3 || 0) + add; m.touch(); for (const f of Chem.react(m)) onReaction(lime, f.rule, f.x); }
    const end = rig.deliveryEnd;
    const surf = lime.container.surfaceWorld().y;
    const rate = clamp(n / dt * 3e3, 0, 3);
    for (let i = 0; i < rate; i++) if (Math.random() < 0.7) FX.bubbles.emit(V3(end.x + (Math.random() - .5) * 0.003, end.y, end.z + (Math.random() - .5) * 0.003), V3(0, 0.05 + Math.random() * 0.03, 0), WHITE, 2, { killY: surf, wobble: 0.01 });
    if (n > 1e-7 && !S.logged.has('limebubbles')) { S.logged.add('limebubbles'); notebookLog('Bubbles of gas are coming out of the delivery tube into the limewater.', 'obs'); }
  }
}

/* ---------- Heating simulation (every frame) ---------- */
function heatSourceFor(e) {
  const s = e.onSource;
  if (s?.kind === 'hotplate' && s.on) return { target: { low: 75, med: 150, high: 280 }[s.level], k: 0.045 };
  if (s?.kind === 'bunsen' && s.on) return { target: s.air ? 650 : 380, k: s.air ? 0.06 : 0.03 };
  if (e.kind === 'boilingtube' && e.bunsen?.on) return { target: e.bunsen.air ? 700 : 400, k: e.bunsen.air ? 0.11 : 0.05 };
  return null;
}
function updateHeat(e, dt) {
  const c = e.container; if (!c || c.infinite || !c.profile) return;
  const m = c.m, liquid = m.vol > 0.05;
  const src = heatSourceFor(e);
  if (src) {
    if (flammableIn(e) && !S.warned.has('flam' + e.id)) {
      S.warned.add('flam' + e.id);
      const f = flammableIn(e);
      if (e.onSource.kind === 'bunsen') { e.onSource.on = false; updateCollar(e.onSource); } else e.onSource.on = false;
      safetyWarning(`Heat turned off – ${f.name.toLowerCase()} is flammable`, f.heatWarning);
      renderCard(); return;
    }
    const k = src.k * (liquid ? clamp(30 / (m.vol + 10), 0.3, 2.5) : 1.4);
    m.temp += (src.target - m.temp) * k * dt;
    if (liquid && m.temp >= 100) {
      m.temp = 100;
      const evap = clamp((src.target - 100) / 250, 0.1, 1) * 0.18 * dt;
      m.vol = Math.max(0, m.vol - evap); m.touch();
      if (Math.random() < 0.6) emitBubbles(e, 1);
      if (Math.random() < 0.35) emitSteam(e.mouthWorld(), 1, WHITE, 0.05);
      if (!S.logged.has('boil' + e.id)) { S.logged.add('boil' + e.id); notebookLog(`The liquid in the ${e.name.toLowerCase()} is boiling (100 °C) – steam is rising.`, 'obs'); bus.emit('boiling', { equip: e }); }
      if (m.vol < 0.06) {
        m.vol = 0; m.touch();
        if (!S.warned.has('dry' + e.id)) { S.warned.add('dry' + e.id); safetyWarning('Boiled dry!', `All the water in the ${e.name.toLowerCase()} has boiled away. Turn off the heat – heating an empty container can crack the glass, and the solid left behind may start to smoke.`); }
      }
    } else if (liquid && m.temp > 70 && Math.random() < 0.08) emitSteam(e.mouthWorld(), 1, WHITE, 0.03);
    if (!liquid && Object.keys(m.ppt).length && m.temp > 200 && Math.random() < 0.3) emitSteam(e.mouthWorld(), 1, new THREE.Color(0.35, 0.35, 0.35), 0.05);
  } else if (m.temp > 20.05 || m.temp < 19.95) {
    m.temp += (20 - m.temp) * (liquid ? 0.015 : 0.05) * dt;
  }
  if (Object.keys(m.solid).length) {
    for (const f of Chem.thermal(m, dt)) {
      if (f.progress > 0.04 && !S.logged.has('dec10' + e.id)) { S.logged.add('dec10' + e.id); notebookLog('The green solid is starting to turn black.', 'obs'); }
      if (f.progress >= 1 && !S.logged.has('dec100' + e.id)) { S.logged.add('dec100' + e.id); notebookLog('All of the solid has turned black (copper(II) oxide). The reaction is complete.', 'obs'); bus.emit('decompDone', { equip: e }); }
      if (f.progress > 0.02) onReaction(e, f.rule, f.x);
      if (e.kind === 'boilingtube') routeGas(e, f.gas, dt);
      e.decompProgress = f.progress;
    }
  }
}

/* ---------- Bench management ---------- */
function addEquip(e, x, z) {

  equipment.push(e);
  if (e.holder) { e.holder.position.copy(e.group.position); scene.add(e.holder); }
  for (const t of e.tubes || []) equipment.push(t);
  e.home = e.group.position.clone();

}
function clearBench() {

  }
  equipment.length = 0; tags.length = 0;

}

  if (e.key === 'Escape') { if ($('#modalBackdrop').classList.contains('show')) closeModal(); else if (S.mode) cancelMode(); else deselect(); }
  if (e.key === 'd' || e.key === 'D') { const b = equipment.find(x => x.kind === 'burette'); if (b && !S.busy) buretteDrop(b); }
  if (e.key === 'r' || e.key === 'R') resetView();
});

  const t = makeTestTube(`Test tube ${label}${fullName ? ' – ' + fullName : ''}`);

      lime.name = 'Test tube of limewater';
      const rack = addEquip(makeRack(2, [lime]), 0.096, 0.02);
      rack.movable = false; lime.movable = false;
      rig.limeTube = lime;
      addEquip(makeBunsen(), 0.45, 0.32);
      addEquip(makeGoggles(), 1.2, 0.38);
      buildDeliveryTube(rig, lime);
    },
    steps: [
      gogglesStep,
      { type: 'next', text: 'Look at the set-up. The boiling tube contains green copper(II) carbonate. The delivery tube carries any gas into the limewater.', hint: 'Zoom in with the scroll wheel to look closely. Click the boiling tube to see what is inside. (The green powder sold as "copper carbonate" is really basic copper carbonate, CuCO₃·Cu(OH)₂ – it decomposes in the same way.)' },
      { text: 'Move the Bunsen burner under the boiling tube.', hint: 'Drag the Bunsen burner onto the green ring under the tube.', check: () => !!find('boilingtube', r => r.bunsen) },
      { text: 'Light the Bunsen burner and open the air hole to get a blue flame.', hint: 'Select the burner → "Light" → "Open air hole". A blue flame is hot enough for decomposition.', check: () => !!find('boilingtube', r => r.bunsen?.on && r.bunsen.air) },
      {
        text: 'Heat strongly until all the green solid has turned black. Watch the limewater closely.',
        hint: 'Keep the blue flame under the tube. It takes about 15–20 seconds of strong heating.',
        progress: () => { const r = find('boilingtube'); return r ? `Decomposed: ${Math.round((r.decompProgress || 0) * 100)}%` : ''; },
        check: ev => ev.type === 'decompDone' || (find('boilingtube')?.decompProgress >= 1),
      },
      {
        text: 'Lift the delivery tube out of the limewater – BEFORE you stop heating.',
        hint: 'Select the boiling tube → "Lift delivery tube out".',
        check: ev => {
          if (ev.type === 'suckback') return { fail: 'You stopped heating first – that can cause suck-back. Lift the delivery tube out now, and remember the order next time.' };
          if (ev.type === 'delivery' && !ev.inLime) return ev.heating ? { pass: true, note: 'Correct order! Now nothing can be sucked back into the hot tube.' } : { pass: true, note: 'Remember: next time lift the tube out before you turn off the burner.' };
        },
      },
      { text: 'Turn off the Bunsen burner.', hint: 'Select the burner → "Turn off".', check: () => !find('bunsen', b => b.on) },
      { type: 'choice', text: 'What is the black solid left in the boiling tube?', options: ['Copper(II) oxide, CuO', 'Copper metal, Cu', 'Carbon, C', 'Copper(II) carbonate, CuCO₃'], answer: 0, explain: 'CuCO₃(s) → CuO(s) + CO₂(g). The black solid is copper(II) oxide; the gas that turned the limewater milky was carbon dioxide.' },
    ],
    quiz: [
      { q: 'Which gas turns limewater milky?', options: ['Carbon dioxide', 'Oxygen', 'Hydrogen', 'Nitrogen'], answer: 0, explain: 'CO₂ reacts with calcium hydroxide to form insoluble calcium carbonate, which makes the limewater cloudy.' },
      { q: 'What type of reaction is CuCO₃ → CuO + CO₂?', options: ['Thermal decomposition', 'Neutralisation', 'Combustion', 'Precipitation'], answer: 0, explain: 'One compound is broken down into two simpler substances by heating – thermal decomposition.' },
      { q: 'Why must the delivery tube be lifted out of the limewater before heating stops?', options: ['To stop cold limewater being sucked back into the hot tube and cracking it', 'To let more gas escape', 'To make the limewater milky', 'To cool the Bunsen burner'], answer: 0, explain: 'As the tube cools, the gas inside contracts and the pressure drops, which can pull limewater back into the hot glass ("suck-back").' },

/* ---------- Toasts ---------- */
function toast({ title, text = '', eq, eq2, kind = '', time = 7000 }) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<button class="x" aria-label="Dismiss">×</button><h4>${esc(title)}</h4>${eq ? `<div class="eq">${esc(eq)}</div>` : ''}${eq2 && eq2 !== eq ? `<div class="eq">${esc(eq2)}</div>` : ''}<div>${esc(text)}</div>`;
  const box = $('#toasts');
  box.appendChild(el);
  while (box.children.length > 2) box.firstChild.remove();
  const kill = () => el.remove();
  el.querySelector('.x').onclick = kill;
  setTimeout(kill, time);
}

/* ---------- Modals ---------- */
function openModal({ icon = 'ℹ️', title, sub = '', body = '', actions = [{ label: 'OK', primary: true }], warn = false, wide = false, onOpen }) {
  const m = $('#modal');
  m.className = 'modal' + (warn ? ' warn' : '');
  m.style.width = wide ? 'min(720px,100%)' : '';
  m.innerHTML = `<div class="m-head"><div class="m-icon">${icon}</div><div><h2>${esc(title)}</h2>${sub ? `<div class="m-sub">${esc(sub)}</div>` : ''}</div></div>
    <div class="m-body">${body}</div>
    <div class="m-actions">${actions.map((a, i) => `<button class="btn ${a.primary ? 'primary' : ''}" data-i="${i}">${esc(a.label)}</button>`).join('')}</div>`;
  m.querySelectorAll('.m-actions button').forEach(b => b.onclick = () => { const a = actions[+b.dataset.i]; if (!a.keepOpen) closeModal(); a.fn?.(); });
  $('#modalBackdrop').classList.add('show');
  onOpen?.(m);
  setTimeout(() => (m.querySelector('.m-actions .primary') || m.querySelector('button'))?.focus(), 30);
}
function closeModal() { $('#modalBackdrop').classList.remove('show'); }
$('#modalBackdrop').addEventListener('mousedown', e => { if (e.target.id === 'modalBackdrop') closeModal(); });

function openPourDialog(src, tgt) {

function liveUpdate() {

function updateSelRing(time) {
  const it = S.selected;
  if (!it || it.decor || !it.group || !it.group.visible) { selRing.visible = false; return; }
  const p = V3(); it.group.getWorldPosition(p);
  if (it.parentEquip) p.y = it.parentEquip.group.position.y;
  selRing.position.set(p.x, p.y + 0.002, p.z);
  if (it.kind === 'boilingtube') { const b = it.tubeG.localToWorld(V3()); selRing.position.set(b.x, BENCH_Y + 0.002, b.z); }
  selRing.scale.setScalar(it.radius * 1.15 + 0.004);
  selRing.material.opacity = 0.55 + 0.3 * Math.sin(time * 4);
  selRing.visible = true;
}

/* ---------- Experiment runner: steps, checks, progress ---------- */
const Runner = {

  start(exp) {
    clearBench();
    this.exp = exp; this.i = 0; this.feedback = null; this.completed = false; this.showHint = false;
    S.notebook = []; S.results = {}; S.logged.clear(); S.explained.clear(); S.warned.clear(); S.t0 = performance.now(); S.titre = null;
    History.clear();
    exp.setup();
    rebuildPickables();
    setGoggles(false);
    S.notebook = [];
    notebookLog(`Started: ${exp.title}.`, 'action');
    $('#nbCount').textContent = '0';
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id === exp.id));
    $('#expTitle').textContent = exp.title; $('#expSub').textContent = exp.sub;
    renderSteps(); renderFoot(); nbDirty = true;
  },
  get step() { return this.exp?.steps[this.i]; },
  handle(ev) {
    const st = this.step;
    if (!st || this.completed || !st.check) return;
    this.apply(st.check(ev));
  },
  apply(r) {
    if (!r) return;
    if (r === true || r.pass) this.pass(r.note);
    else if (r.fail) { this.feedback = { text: r.fail, good: false }; renderSteps(); }
  },
  pass(note, value) {
    const st = this.step;
    const extra = st.onPass?.(value);
    this.i++; this.showHint = false;
    this.feedback = { text: (typeof extra === 'string' ? extra : note) || ['Well done!', 'Great!', 'Correct!', 'Nice work!'][this.i % 4], good: true };
    if (this.i >= this.exp.steps.length) { this.completed = true; notebookLog('Experiment complete.', 'result'); }
    renderSteps(); renderFoot();
    if (!this.completed) setTimeout(() => this.handle({ type: 'enter' }), 400);
    else setTimeout(() => offerQuiz(), 900);
  },
};

/* ---------- Titration curve graph ---------- */
function drawGraph() {
  S.titr.dirty = false;
  const cv = $('#graph'); if (!cv) return;
  const W = cv.clientWidth, H = cv.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  if (!W) return;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const text = css.getPropertyValue('--muted').trim(), grid = css.getPropertyValue('--border').trim(), acc = css.getPropertyValue('--accent').trim();
  const pts = S.titr.points;
  const maxV = Math.max(30, Math.ceil(((pts.length ? pts[pts.length - 1].v : 0) + 5) / 5) * 5);
  const L = 30, R = 8, T = 8, B = 24, w = W - L - R, hh = H - T - B;
  const X = v => L + (v / maxV) * w, Y = p => T + (1 - p / 14) * hh;
  g.fillStyle = 'rgba(255,42,146,0.12)'; g.fillRect(L, Y(10), w, Y(8.2) - Y(10));
  g.strokeStyle = grid; g.lineWidth = 1; g.fillStyle = text; g.font = '10px system-ui'; g.textAlign = 'right'; g.textBaseline = 'middle';
  for (let p = 0; p <= 14; p += 2) { g.beginPath(); g.moveTo(L, Y(p)); g.lineTo(L + w, Y(p)); g.stroke(); g.fillText(p, L - 5, Y(p)); }
  g.textAlign = 'center'; g.textBaseline = 'top';
  for (let v = 0; v <= maxV; v += maxV > 40 ? 10 : 5) { g.fillText(v, X(v), T + hh + 5); }
  g.save(); g.translate(9, T + hh / 2); g.rotate(-Math.PI / 2); g.textBaseline = 'middle'; g.fillText('pH', 0, 0); g.restore();
  g.textAlign = 'right'; g.fillText('volume of NaOH / cm³', L + w, T + hh - 14);
  if (pts.length > 1) {
    g.strokeStyle = acc; g.lineWidth = 2.2; g.beginPath();
    pts.forEach((p, i) => i ? g.lineTo(X(p.v), Y(p.pH)) : g.moveTo(X(p.v), Y(p.pH)));
    g.stroke();
  }
  if (pts.length) { const p = pts[pts.length - 1]; g.fillStyle = acc; g.beginPath(); g.arc(X(p.v), Y(p.pH), 3.5, 0, Math.PI * 2); g.fill(); }
  if (S.titr.end) { g.strokeStyle = '#e0287f'; g.setLineDash([4, 3]); g.beginPath(); g.moveTo(X(S.titr.end.v), T); g.lineTo(X(S.titr.end.v), T + hh); g.stroke(); g.setLineDash([]); g.fillStyle = '#e0287f'; g.textAlign = 'left'; g.fillText('end point', X(S.titr.end.v) + 4, T + 4); }
}

/* =====================================================================
   7. MAIN LOOP & START-UP
   ===================================================================== */
const clock = new THREE.Clock();
let liveTimer = 0, graphTimer = 0;

/* ---------- Adaptive quality: if the frame rate stays low, lower resolution, then turn off shadows ---------- */
const QUALITY = { level: new URLSearchParams(location.search).get('quality') === 'low' ? 0 : 2, acc: 0, frames: 0, skip: 2 };
function applyQuality() {
  renderer.setPixelRatio(QUALITY.level >= 2 ? Math.min(window.devicePixelRatio, 1.75) : 1);
  sun.castShadow = QUALITY.level >= 1;
  onResize();
}
function adaptQuality(rawDt) {
  if (rawDt > 0.25) return;                 // tab was hidden or paused – ignore this frame
  QUALITY.acc += rawDt; QUALITY.frames++;
  if (QUALITY.acc < 2) return;
  const fps = QUALITY.frames / QUALITY.acc;
  QUALITY.acc = 0; QUALITY.frames = 0;
  if (QUALITY.skip > 0) { QUALITY.skip--; return; }   // first seconds include shader compilation
  if (fps < 42 && QUALITY.level > 0) {
    QUALITY.level--; QUALITY.skip = 1; applyQuality();
    toast({ title: 'Graphics simplified', text: QUALITY.level === 1 ? 'The lab lowered its resolution so it runs smoothly on this computer.' : 'Shadows were turned off so the lab runs smoothly on this computer.', time: 5000 });
  }
}
document.addEventListener('visibilitychange', () => { QUALITY.acc = 0; QUALITY.frames = 0; });

function loop() {
  requestAnimationFrame(loop);
  const raw = clock.getDelta();
  adaptQuality(raw);
  const dt = Math.min(raw, 0.05) * TIME_SCALE, time = clock.elapsedTime;
  updateTweens(dt);
  for (let i = 0; i < equipment.length; i++) {
    const e = equipment[i];
    if (e.kind === 'burette') updateBurette(e, dt);
    else if (e.kind === 'bunsen') updateFlame(e, dt, time);
    else if (e.kind === 'hotplate') {
      e.plateT += ((e.on ? { low: 120, med: 220, high: 330 }[e.level] : 20) - e.plateT) * 0.6 * dt;
      e.plateMat.emissiveIntensity = smoothstep(70, 330, e.plateT) * 0.55;
      e.led.material.emissiveIntensity = e.on ? 2 : 0;
    }
    if (e.container) { updateHeat(e, dt); e.container.updateVisual(dt); }
  }
  FX.bubbles.update(dt); FX.flakes.update(dt); FX.steam.update(dt);
  updateHover();
  updateSelRing(time);
  liveTimer -= dt;
  if (liveTimer <= 0) { liveTimer = 0.2; liveUpdate(); updateReadouts(); updateProgressLine(); if (nbDirty) renderNotebook(); }
  graphTimer -= dt;
  if (S.titr.dirty && graphTimer <= 0) { graphTimer = 0.1; drawGraph(); }
  controls.update(); clampTarget();
  renderer.render(scene, camera);
}
